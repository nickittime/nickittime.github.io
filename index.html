<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manvender Singh — Software Developer (C++, C, Python)</title>
<meta name="description" content="Manvender Singh: final-year Information Science student in Bengaluru, open to Software Engineer Trainee roles. Projects in C++ and Python with tests and CI.">
<meta property="og:title" content="Manvender Singh">
<meta property="og:description" content="C++, C and Python. A key-value store in C++, a freight-cost anomaly detector, and a risk-management API. Open to fresher roles in Bengaluru.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nickittime.github.io/">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232743c8'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EMS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f8fa;
    --bg-grid: rgba(21, 32, 43, 0.045);
    --surface: #ffffff;
    --surface-hover: #fcfdff;
    --nav-bg: rgba(246, 248, 250, 0.82);
    --ink: #111827;
    --muted: #4b5563;
    --line: #dde3ea;
    --line-strong: #c4cdd8;
    --accent: #2743c8;
    --accent-soft: rgba(39, 67, 200, 0.08);
    --accent-glow: rgba(39, 67, 200, 0.16);
    --ok: #15803d;
    --ok-soft: rgba(21, 128, 61, 0.12);
    --term-bg: #0f172a;
    --term-bar: #1e293b;
    --term-ink: #e2e8f0;
    --term-dim: #7c8ba1;
    --term-accent: #93c5fd;
    --term-ok: #6ee7b7;
    --term-warn: #fcd34d;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 8px 24px -6px rgba(15, 23, 42, 0.08), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
    --shadow-term: 0 20px 45px -15px rgba(15, 23, 42, 0.28), 0 0 0 1px rgba(15, 23, 42, 0.08);
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  :root[data-theme="dark"] {
    --bg: #0d1117;
    --bg-grid: rgba(255, 255, 255, 0.035);
    --surface: #161b22;
    --surface-hover: #1b222c;
    --nav-bg: rgba(13, 17, 23, 0.82);
    --ink: #e6edf3;
    --muted: #8b949e;
    --line: #28303a;
    --line-strong: #3a4554;
    --accent: #8ea2ff;
    --accent-soft: rgba(142, 162, 255, 0.12);
    --accent-glow: rgba(142, 162, 255, 0.22);
    --ok: #3fb950;
    --ok-soft: rgba(63, 185, 80, 0.15);
    --term-bg: #090d13;
    --term-bar: #131922;
    --term-ink: #e2e8f0;
    --term-dim: #6e7b8f;
    --term-accent: #9fb0ff;
    --term-ok: #6ee7b7;
    --term-warn: #fde047;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shadow-md: 0 10px 28px -8px rgba(0, 0, 0, 0.45);
    --shadow-term: 0 24px 50px -15px rgba(0, 0, 0, 0.65), 0 0 0 1px #28303a;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117;
      --bg-grid: rgba(255, 255, 255, 0.035);
      --surface: #161b22;
      --surface-hover: #1b222c;
      --nav-bg: rgba(13, 17, 23, 0.82);
      --ink: #e6edf3;
      --muted: #8b949e;
      --line: #28303a;
      --line-strong: #3a4554;
      --accent: #8ea2ff;
      --accent-soft: rgba(142, 162, 255, 0.12);
      --accent-glow: rgba(142, 162, 255, 0.22);
      --ok: #3fb950;
      --ok-soft: rgba(63, 185, 80, 0.15);
      --term-bg: #090d13;
      --term-bar: #131922;
      --term-ink: #e2e8f0;
      --term-dim: #6e7b8f;
      --term-accent: #9fb0ff;
      --term-ok: #6ee7b7;
      --term-warn: #fde047;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 10px 28px -8px rgba(0, 0, 0, 0.45);
      --shadow-term: 0 24px 50px -15px rgba(0, 0, 0, 0.65), 0 0 0 1px #28303a;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
    scroll-padding-top: 4.5rem;
  }

  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--ink);
    font: 1.03rem/1.65 var(--sans);
    transition: background-color 0.25s ease, color 0.25s ease;
    overflow-x: hidden;
  }

  a {
    color: var(--accent);
    text-underline-offset: 0.22em;
    transition: color 0.18s ease, opacity 0.18s ease;
  }
  a:hover { text-decoration-thickness: 2px; }

  :focus-visible {
    outline: 2.5px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
  }

  .skip {
    position: absolute;
    left: 1rem;
    top: -4rem;
    background: var(--accent);
    color: #fff;
    padding: 0.55rem 1rem;
    border-radius: 8px;
    font-weight: 600;
    z-index: 100;
    transition: top 0.2s var(--ease-out);
  }
  .skip:focus { top: 1rem; }

  .wrap {
    max-width: 68rem;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  /* Scroll progress hairline */
  .scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 2.5px;
    width: 100%;
    background: linear-gradient(90deg, var(--accent), var(--ok));
    transform-origin: 0 50%;
    transform: scaleX(0);
    z-index: 60;
    pointer-events: none;
  }

  /* Sticky glass navbar */
  .top {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--nav-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }

  .top .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 3.75rem;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }

  .brand-mark {
    display: inline-grid;
    place-items: center;
    width: 1.75rem;
    height: 1.75rem;
    border-radius: 6px;
    background: var(--accent);
    color: var(--bg);
    font: 700 0.78rem/1 var(--mono);
    transition: transform 0.25s var(--ease-out);
  }
  .brand:hover .brand-mark { transform: rotate(-6deg) scale(1.06); }

  .nav-group {
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }

  .top nav ul {
    display: flex;
    gap: 0.25rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .top nav a {
    display: inline-block;
    padding: 0.35rem 0.65rem;
    border-radius: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 500;
    transition: color 0.18s ease, background-color 0.18s ease;
  }

  .top nav a:hover,
  .top nav a.active {
    color: var(--ink);
    background: var(--accent-soft);
  }

  .theme-btn {
    display: inline-grid;
    place-items: center;
    width: 2.15rem;
    height: 2.15rem;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.18s ease, transform 0.18s var(--ease-out), background-color 0.18s ease;
  }
  .theme-btn:hover {
    border-color: var(--line-strong);
    transform: translateY(-1px);
  }
  .theme-btn svg { width: 1.05rem; height: 1.05rem; }

  /* Hero with architectural grid & subtle radial glow */
  .hero {
    position: relative;
    padding: 4.5rem 0 4.25rem;
    background-image:
      radial-gradient(circle at 75% 30%, var(--accent-glow), transparent 48%),
      linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px);
    background-size: 100% 100%, 32px 32px, 32px 32px;
  }

  .hero::after {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 3.5rem;
    background: linear-gradient(to bottom, transparent, var(--bg));
    pointer-events: none;
  }

  .hero .wrap {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.04fr) minmax(0, 1fr);
    gap: 3rem;
    align-items: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font: 500 0.82rem/1.4 var(--mono);
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--line);
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    margin-bottom: 1rem;
  }

  .hero h1 {
    font-size: clamp(2.45rem, 5vw, 3.65rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin: 0 0 0.65rem;
  }

  .hero .role {
    font-size: 1.25rem;
    font-weight: 500;
    line-height: 1.4;
    margin: 0 0 1.1rem;
    color: var(--ink);
  }

  .hero .intro {
    color: var(--muted);
    max-width: 34rem;
    margin: 0 0 1.35rem;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.65rem;
    margin: 0 0 1.75rem;
    padding: 0.45rem 0.85rem;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    font-size: 0.92rem;
    font-weight: 600;
  }

  .status-dot {
    position: relative;
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    background: var(--ok);
    flex: none;
  }

  .status-dot::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: var(--ok);
    opacity: 0.35;
    animation: pulse-ring 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
  }

  @keyframes pulse-ring {
    0% { transform: scale(0.75); opacity: 0.55; }
    70%, 100% { transform: scale(2.1); opacity: 0; }
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.7rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.62rem 1.05rem;
    border-radius: 9px;
    font-size: 0.94rem;
    font-weight: 600;
    text-decoration: none;
    border: 1.5px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s var(--ease-out), border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
  }

  .btn:hover {
    text-decoration: none;
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .btn:active { transform: translateY(0); }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  .btn.primary:hover {
    filter: brightness(1.06);
  }

  .btn svg {
    width: 1rem;
    height: 1rem;
    flex: none;
  }

  /* Interactive kvlite terminal */
  .terminal { margin: 0; }

  .term-window {
    border-radius: 13px;
    overflow: hidden;
    background: var(--term-bg);
    box-shadow: var(--shadow-term);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out);
  }

  .term-window:hover {
    transform: translateY(-2px);
  }

  .term-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.65rem 1rem;
    background: var(--term-bar);
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    font: 500 0.78rem/1 var(--mono);
    color: var(--term-dim);
  }

  .term-dots {
    display: flex;
    align-items: center;
    gap: 0.42rem;
  }
  .term-dots span {
    width: 0.65rem;
    height: 0.65rem;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.16);
  }
  .term-dots span:nth-child(1) { background: #ef4444; opacity: 0.85; }
  .term-dots span:nth-child(2) { background: #f59e0b; opacity: 0.85; }
  .term-dots span:nth-child(3) { background: #10b981; opacity: 0.85; }

  .term-badge {
    padding: 0.18rem 0.5rem;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--term-ok);
    font-size: 0.73rem;
  }

  .term-body {
    padding: 1.05rem 1.25rem;
    max-height: 20.5rem;
    overflow-y: auto;
    color: var(--term-ink);
    font: 0.86rem/1.62 var(--mono);
    cursor: text;
  }

  .term-line {
    white-space: pre-wrap;
    word-break: break-word;
  }

  .term-line.reveal-line {
    animation: line-in 0.22s var(--ease-out) both;
  }

  @keyframes line-in {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .terminal .p { color: var(--term-dim); user-select: none; }
  .terminal .c { color: var(--term-accent); font-weight: 500; }
  .terminal .ok { color: var(--term-ok); }
  .terminal .nil { color: var(--term-dim); font-style: italic; }
  .terminal .err { color: #fca5a5; }

  .term-input-row {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    margin-top: 0.15rem;
  }

  .term-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    color: var(--term-accent);
    font: inherit;
    padding: 0;
    caret-color: var(--term-ok);
  }
  .term-input:focus { outline: none; }
  .term-input::placeholder { color: rgba(148, 163, 184, 0.45); font-style: italic; }

  .term-chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    background: rgba(255, 255, 255, 0.025);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }

  .term-chips span {
    font: 0.72rem/1 var(--mono);
    color: var(--term-dim);
    margin-right: 0.2rem;
  }

  .chip-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--term-ink);
    font: 0.75rem/1.3 var(--mono);
    padding: 0.22rem 0.5rem;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .chip-btn:hover {
    background: rgba(147, 197, 253, 0.16);
    border-color: var(--term-accent);
    transform: translateY(-1px);
  }

  .terminal figcaption {
    margin-top: 0.75rem;
    font-size: 0.88rem;
    color: var(--muted);
  }
  .terminal figcaption code {
    font: 0.84em var(--mono);
    color: var(--ink);
    background: var(--surface);
    padding: 0.1rem 0.35rem;
    border-radius: 4px;
    border: 1px solid var(--line);
  }

  /* Sections */
  section {
    padding: 4rem 0;
    border-top: 1px solid var(--line);
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 2.25rem;
  }

  h2 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin: 0;
  }

  .section-tag {
    font: 500 0.8rem/1 var(--mono);
    color: var(--muted);
  }

  /* Project cards */
  .project-list {
    display: grid;
    gap: 1.35rem;
  }

  .project {
    display: grid;
    grid-template-columns: 15.5rem minmax(0, 1fr);
    gap: 2.25rem;
    padding: 1.75rem;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    transition: transform 0.25s var(--ease-out), border-color 0.25s ease, box-shadow 0.25s var(--ease-out), background-color 0.25s ease;
  }

  .project:hover {
    transform: translateY(-3px);
    border-color: var(--line-strong);
    box-shadow: var(--shadow-md);
    background: var(--surface-hover);
  }

  .project h3 {
    font-size: 1.32rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.25;
    margin: 0 0 0.35rem;
  }

  .project .kind {
    color: var(--muted);
    margin: 0 0 1.15rem;
    font-size: 0.92rem;
  }

  .project .links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.45rem;
  }

  .project .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.92rem;
    font-weight: 500;
    text-decoration: none;
  }

  .project .links a:hover {
    text-decoration: underline;
  }

  .project .links a .arrow {
    display: inline-block;
    transition: transform 0.2s var(--ease-out);
  }

  .project .links a:hover .arrow {
    transform: translate(2px, -2px);
  }

  .project dl {
    margin: 0;
    display: grid;
    grid-template-columns: 6.25rem minmax(0, 1fr);
    gap: 0.7rem 1.25rem;
    align-items: baseline;
  }

  .project dt {
    font: 600 0.85rem/1.5 var(--mono);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .project dd {
    margin: 0;
    max-width: 44rem;
  }

  .metric {
    font-weight: 600;
    color: var(--ink);
  }

  .tech {
    list-style: none;
    padding: 0;
    margin: 0.15rem 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .tech li {
    font: 500 0.8rem/1.4 var(--mono);
    padding: 0.2rem 0.55rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    transition: border-color 0.18s ease, transform 0.18s ease;
  }

  .project:hover .tech li {
    border-color: var(--line-strong);
  }

  /* Skills */
  .skills {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.25rem;
    margin: 0;
  }

  .skill-card {
    padding: 1.35rem 1.5rem;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s ease, transform 0.2s var(--ease-out);
  }

  .skill-card:hover {
    border-color: var(--line-strong);
    transform: translateY(-2px);
  }

  .skills dt {
    font-weight: 700;
    font-size: 1.02rem;
    margin-bottom: 0.4rem;
    color: var(--ink);
  }

  .skills dd {
    margin: 0;
    color: var(--muted);
    line-height: 1.6;
  }

  /* About */
  .about {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.25rem;
  }

  .about-card {
    padding: 1.35rem 1.5rem;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s ease, transform 0.2s var(--ease-out);
  }

  .about-card:hover {
    border-color: var(--line-strong);
    transform: translateY(-2px);
  }

  .about h3 {
    font-size: 1.02rem;
    font-weight: 700;
    margin: 0 0 0.4rem;
  }

  .about p {
    margin: 0;
    color: var(--muted);
  }

  /* Contact */
  .contact-box {
    padding: 2rem;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
  }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.85rem;
    margin: 0.5rem 0 0;
  }

  .contact .email {
    font-size: clamp(1.2rem, 3.2vw, 1.85rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    word-break: break-word;
  }
